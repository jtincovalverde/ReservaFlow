function products(){

var renderers={dashboard:dashboard,companies:companies,contacts:contacts,opps:opps,followups:followups,quotes:quotes,products:products,after:after,team:team};
function render(){document.getElementById("page").innerHTML=renderers[view]();bind()}
function bind(){
document.querySelectorAll("[data-new]").forEach(function(b){b.onclick=function(){openForm(b.dataset.new)}});
document.querySelectorAll("[data-export]").forEach(function(b){b.onclick=exportData});
document.querySelector("[data-reset]")&& (document.querySelector("[data-reset]").onclick=function(){if(confirm("¿Restablecer datos ficticios?")){state=structuredClone(seed);save();shell()}});
document.querySelectorAll("[data-done]").forEach(function(b){b.onclick=function(){var x=state.followups.find(function(f){return f.id===b.dataset.done});x.status="Completado";save();render()}});
document.querySelectorAll("[data-pdf]").forEach(function(b){b.onclick=function(){openQuote(b.dataset.pdf)}});
document.querySelectorAll("[data-user]").forEach(function(b){b.onclick=function(){state.current=b.dataset.user;save();shell()}});

var titles={companies:"Nueva empresa",contacts:"Nuevo contacto",opps:"Nueva oportunidad",followups:"Nuevo seguimiento",quotes:"Nueva cotización",products:"Nuevo producto",after:"Nuevo registro de posventa"},m=document.getElementById("modal");

document.getElementById("importer").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{state=JSON.parse(r.result);save();shell()}catch(x){alert("Respaldo no válido")}};r.readAsText(f)};
shell();
