<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">ReservaFlow operations preview</title>
  <desc id="desc">A visual overview of ReservaFlow showing reservation control, KPIs, workflow and operational value.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#10213b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="620" rx="30" fill="url(#bg)"/>
  <circle cx="1080" cy="85" r="180" fill="#2563eb" opacity="0.12"/>
  <circle cx="105" cy="565" r="170" fill="#0ea5e9" opacity="0.08"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="64" y="72" fill="#7dd3fc" font-size="15" font-weight="700" letter-spacing="2.2">OPERATIONS WORKFLOW</text>
    <text x="64" y="122" fill="#f8fafc" font-size="42" font-weight="800">ReservaFlow</text>
    <text x="64" y="158" fill="#a9b8cc" font-size="19">Turn scattered bookings into one controlled reservation process.</text>

    <g transform="translate(64 200)" filter="url(#shadow)">
      <rect width="730" height="344" rx="22" fill="#0d1728" stroke="#263a56"/>
      <rect width="730" height="54" rx="22" fill="#111f34"/>
      <rect y="32" width="730" height="22" fill="#111f34"/>

      <rect x="22" y="18" width="20" height="20" rx="5" fill="url(#accent)"/>
      <path d="M28 28l4 4 7-9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="54" y="34" fill="#f8fafc" font-size="18" font-weight="700">ReservaFlow</text>
      <text x="184" y="34" fill="#9fb0c6" font-size="13">Dashboard</text>
      <text x="266" y="34" fill="#9fb0c6" font-size="13">Reservations</text>
      <text x="365" y="34" fill="#9fb0c6" font-size="13">New reservation</text>
      <circle cx="650" cy="27" r="12" fill="#1e3a5f"/>
      <text x="671" y="32" fill="#9fb0c6" font-size="12">jemerson</text>

      <text x="24" y="92" fill="#cbd5e1" font-size="14" font-weight="700">TODAY'S CONTROL PANEL</text>

      <g transform="translate(24 112)">
        <rect width="158" height="76" rx="14" fill="#12233a" stroke="#244361"/>
        <text x="16" y="28" fill="#8ca2bb" font-size="11">TOTAL</text>
        <text x="16" y="58" fill="#f8fafc" font-size="28" font-weight="800">24</text>
      </g>
      <g transform="translate(196 112)">
        <rect width="158" height="76" rx="14" fill="#12233a" stroke="#244361"/>
        <text x="16" y="28" fill="#8ca2bb" font-size="11">PENDING</text>
        <text x="16" y="58" fill="#fbbf24" font-size="28" font-weight="800">6</text>
      </g>
      <g transform="translate(368 112)">
        <rect width="158" height="76" rx="14" fill="#12233a" stroke="#244361"/>
        <text x="16" y="28" fill="#8ca2bb" font-size="11">CONFIRMED</text>
        <text x="16" y="58" fill="#38bdf8" font-size="28" font-weight="800">13</text>
      </g>
      <g transform="translate(540 112)">
        <rect width="166" height="76" rx="14" fill="#12233a" stroke="#244361"/>
        <text x="16" y="28" fill="#8ca2bb" font-size="11">COMPLETED</text>
        <text x="16" y="58" fill="#34d399" font-size="28" font-weight="800">5</text>
      </g>

      <text x="24" y="226" fill="#cbd5e1" font-size="13" font-weight="700">RECENT RESERVATIONS</text>
      <rect x="24" y="242" width="682" height="76" rx="13" fill="#0a1423" stroke="#203754"/>
      <text x="40" y="265" fill="#7f95ad" font-size="10">CLIENT</text>
      <text x="208" y="265" fill="#7f95ad" font-size="10">SERVICE</text>
      <text x="365" y="265" fill="#7f95ad" font-size="10">TIME</text>
      <text x="485" y="265" fill="#7f95ad" font-size="10">STATUS</text>
      <text x="40" y="294" fill="#e2e8f0" font-size="13" font-weight="600">Ana Torres</text>
      <text x="208" y="294" fill="#b7c5d6" font-size="13">Consultation</text>
      <text x="365" y="294" fill="#b7c5d6" font-size="13">14:30</text>
      <rect x="485" y="278" width="96" height="24" rx="12" fill="#0f3854"/>
      <text x="504" y="294" fill="#7dd3fc" font-size="11" font-weight="700">CONFIRMED</text>
      <rect x="605" y="278" width="82" height="24" rx="12" fill="#18283d"/>
      <text x="628" y="294" fill="#bac8d8" font-size="11">EDIT</text>
    </g>

    <g transform="translate(830 208)">
      <text x="0" y="0" fill="#7dd3fc" font-size="13" font-weight="700" letter-spacing="1.5">MANAGEMENT VALUE</text>
      <text x="0" y="38" fill="#f8fafc" font-size="25" font-weight="800">One workflow.</text>
      <text x="0" y="68" fill="#f8fafc" font-size="25" font-weight="800">Better control.</text>

      <g transform="translate(0 100)">
        <rect width="306" height="58" rx="14" fill="#12233a" stroke="#244361"/>
        <circle cx="28" cy="29" r="10" fill="#0ea5e9"/>
        <path d="M23 29l4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/>
        <text x="50" y="25" fill="#f1f5f9" font-size="13" font-weight="700">Centralized information</text>
        <text x="50" y="43" fill="#8fa4bc" font-size="11">One source of truth for bookings.</text>
      </g>
      <g transform="translate(0 170)">
        <rect width="306" height="58" rx="14" fill="#12233a" stroke="#244361"/>
        <circle cx="28" cy="29" r="10" fill="#6366f1"/>
        <path d="M23 29l4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/>
        <text x="50" y="25" fill="#f1f5f9" font-size="13" font-weight="700">Conflict prevention</text>
        <text x="50" y="43" fill="#8fa4bc" font-size="11">Validate slots before saving.</text>
      </g>
      <g transform="translate(0 240)">
        <rect width="306" height="58" rx="14" fill="#12233a" stroke="#244361"/>
        <circle cx="28" cy="29" r="10" fill="#10b981"/>
        <path d="M23 29l4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/>
        <text x="50" y="25" fill="#f1f5f9" font-size="13" font-weight="700">Decision visibility</text>
        <text x="50" y="43" fill="#8fa4bc" font-size="11">KPIs, status and recent activity.</text>
      </g>
    </g>

    <g transform="translate(64 576)">
      <rect width="1072" height="1" fill="#263a56"/>
      <text x="0" y="28" fill="#7890aa" font-size="12">Capture</text>
      <text x="87" y="28" fill="#4c6684" font-size="14">→</text>
      <text x="118" y="28" fill="#7890aa" font-size="12">Validate</text>
      <text x="214" y="28" fill="#4c6684" font-size="14">→</text>
      <text x="245" y="28" fill="#7890aa" font-size="12">Schedule</text>
      <text x="346" y="28" fill="#4c6684" font-size="14">→</text>
      <text x="378" y="28" fill="#7890aa" font-size="12">Track</text>
      <text x="444" y="28" fill="#4c6684" font-size="14">→</text>
      <text x="475" y="28" fill="#7dd3fc" font-size="12" font-weight="700">Decide</text>
      <text x="1072" y="28" fill="#7890aa" font-size="12" text-anchor="end">Python · Flask · SQLite · JavaScript</text>
    </g>
  </g>
</svg>