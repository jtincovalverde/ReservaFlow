<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">ReservaFlow</title>
  <desc id="desc">Reservation operations system built with Flask, SQLite and JavaScript.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#12233d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="30" r="180" fill="#2563eb" opacity=".13"/>
  <text x="64" y="78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.8" fill="#7dd3fc">BUSINESS SYSTEMS · OPERATIONS</text>
  <text x="64" y="148" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="850" fill="#f8fbff">ReservaFlow</text>
  <text x="64" y="190" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" fill="url(#accent)">Turn scattered bookings into one controlled workflow.</text>
  <text x="64" y="232" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#a8b8ca">Flask · SQLite · JavaScript · Authentication · Scheduling controls · Dashboard metrics</text>
  <g transform="translate(880 98)">
    <rect width="230" height="118" rx="18" fill="#101f34" stroke="#2c4565"/>
    <text x="22" y="34" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#7f94aa">OPERATING MODEL</text>
    <text x="22" y="70" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#f8fbff">Centralize</text>
    <text x="22" y="95" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#f8fbff">Validate · Control</text>
  </g>
</svg>