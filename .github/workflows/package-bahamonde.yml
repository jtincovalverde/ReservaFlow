name: Empaquetar Bahamonde CRM
on:
  pull_request:
    branches: [main]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: Bahamonde_CRM_Demo_Corregida
          path: deliverables/bahamonde-crm-demo
          if-no-files-found: error
