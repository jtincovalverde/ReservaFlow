{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}

<div class="auth-container">
    <div class="auth-card">

        <h1>Create Account</h1>
        <p class="text-muted">Create your ReservaFlow account</p>

        {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
        {% endif %}

        <form action="/register" method="post">

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input
                    autocomplete="off"
                    autofocus
                    class="form-control"
                    name="username"
                    placeholder="Enter your username"
                    type="text"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input
                    class="form-control"
                    name="password"
                    placeholder="Enter your password"
                    type="password"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input
                    class="form-control"
                    name="confirmation"
                    placeholder="Repeat your password"
                    type="password"
                    required>
            </div>

            <button class="btn btn-primary w-100" type="submit">
                Create Account
            </button>

        </form>

        <p class="mt-3 text-center">
            Already have an account?
            <a href="/login">Log in</a>
        </p>

    </div>
</div>

{% endblock %}
